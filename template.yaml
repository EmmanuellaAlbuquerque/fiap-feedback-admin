AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: (fiap-feedback-admin) - Cadastro de Admins (MS4)

Globals:
  Function:
    Runtime: java17
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64

Resources:

  ## =========================
  ## Lambda - Admin Management
  ## =========================
  AdminManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ms4-admin-management
      Runtime: java17
      Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler
      CodeUri: target/function.zip

      Environment:
        Variables:
          QUARKUS_LAMBDA_HANDLER: adminManagementFunction
          # Importa o nome da tabela DynamoDB da stack compartilhada
          ADMIN_TABLE_NAME: !ImportValue AdminTableName

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !ImportValue AdminTableName

      Events:
        CreateAdmin:
          Type: Api
          Properties:
            Path: /admins/subscription
            Method: post
